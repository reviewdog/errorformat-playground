name: reviewdog
on: [pull_request]
jobs:
  stylelint:
    name: runner / stylelint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: stylelint-github
        uses: reviewdog/action-stylelint@v1.30.0
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review

  eslint:
    name: runner / eslint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: eslint
        uses: reviewdog/action-eslint@v1.36.1
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          eslint_flags: 'main.js'
